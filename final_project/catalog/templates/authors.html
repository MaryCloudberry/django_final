<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторы</title>
</head>
<body>

    <h1>Авторы курсов</h1>

    <nav>
        <a href="{% url 'catalog:index' %}">Главная</a> |
        <a href="{% url 'catalog:courses' %}">Курсы</a> |
        <a href="{% url 'catalog:authors' %}">Авторы</a> |
        <a href="{% url 'catalog:info' %}">О проекте</a>
    </nav>

    <hr>

    {% for author in authors %}

        <h2>
            <a href="{% url 'catalog:author_detail' author.id %}">
                {{ author.name }}
            </a>
        </h2>

        <p>{{ author.title }}</p>

        <hr>

    {% empty %}

        <p>Авторов пока нет.</p>

    {% endfor %}

</body>
</html>
