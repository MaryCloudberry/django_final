<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курсы</title>
</head>
<body>
    <h1>Список курсов</h1>

    <nav>
        <a href="{% url 'catalog:index' %}">Главная</a> |
        <a href="{% url 'catalog:courses' %}">Курсы</a> |
        <a href="{% url 'catalog:authors' %}">Авторы</a> |
        <a href="{% url 'catalog:info' %}">О проекте</a>
    </nav>

    <hr>

    {% for course in courses %}
        <div>
            <h2>
                <a href="{% url 'catalog:course_detail' course.id %}">
                    {{ course.title }}
                </a>
            </h2>

            <p>{{ course.description }}</p>

            <p>
                <strong>Автор:</strong>
                {{ course.author }}
            </p>
        </div>

        <hr>
    {% empty %}
        <p>Курсов пока нет.</p>
    {% endfor %}
</body>
</html>
